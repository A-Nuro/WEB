server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    error_page 404 =200 /error;
    location /error {
        return 200 "Oops! Page not found. So go back, >:(";
        add_header Content-Type text/plain;
    }
}
